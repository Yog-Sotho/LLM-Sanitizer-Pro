[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-sanitizer-pro"
dynamic = ["version"]
description = "Production-grade, modular dataset sanitization and curation for LLM training."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sanitize Pro Contributors"}]
keywords = ["llm", "dataset", "sanitization", "pii", "deduplication", "nlp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "tqdm>=4.60.0",
]

[project.urls]
Homepage = "https://github.com/Yog-Sotho/LLM-Sanitizer-Pro"
Repository = "https://github.com/Yog-Sotho/LLM-Sanitizer-Pro"
Issues = "https://github.com/Yog-Sotho/LLM-Sanitizer-Pro/issues"

[project.optional-dependencies]
all = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "ijson>=3.2.0",
    "langdetect>=1.0.9",
    "pyyaml>=6.0",
    "pyarrow>=14.0.0",
    "datasketch>=1.6.0",
    "rensa>=0.5",
    "transformers>=4.30.0",
]
fuzzy = [
    "rensa>=0.5",
]
ner = [
    "spacy>=3.5.0",
]
gliner = [
    "gliner2>=1.0",
    "peft",  # gliner2 imports it unconditionally
]
semantic = [
    "model2vec>=0.3.0",
    "usearch>=2.0",
]
lang = [
    "fasttext-numpy2-wheel>=0.9.2",
]
quality = [
    "transformers>=4.30.0",
    "torch>=2.0",
    "fasttext-numpy2-wheel>=0.9.2",
]
dev = [
    "ruff>=0.1.0,<0.17",
    "mypy>=2.3,<3; python_version >= '3.10'",  # type-checked in CI on 3.12
    "pytest>=7.4.0",
]

[project.scripts]
sanitize = "sanitizer_pro.cli:main"

[tool.setuptools.packages.find]
include = ["sanitizer_pro*"]

[tool.setuptools.dynamic]
version = {attr = "sanitizer_pro.__version__"}  # single source of truth

[tool.setuptools.package-data]
sanitizer_pro = ["py.typed", "data/*.jsonl"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Explicit rule set so newer ruff releases (whose defaults grow) can't break CI.
select = ["E4", "E7", "E9", "F"]
# E701/E702: the codebase deliberately uses compact `if cond: stmt` one-liners.
ignore = ["E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# Newest mypy cannot target 3.9; 3.9 syntax compatibility is enforced by ruff
# (target-version py39) and the 3.9 CI test job.
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["sanitizer_pro"]

[[tool.mypy.overrides]]
# Optional extras: treated as opaque (Any) whether or not they — or their
# stub packages — are installed, so results don't depend on the environment.
module = [
    "datasketch", "ijson", "langdetect", "model2vec", "numpy", "openpyxl", "pandas",
    "pyarrow", "pyarrow.*", "spacy", "torch", "tqdm", "transformers", "xlsxwriter", "yaml",
    "fasttext", "huggingface_hub", "gliner2", "rensa", "usearch", "usearch.*",
]
ignore_missing_imports = true
follow_imports = "skip"
