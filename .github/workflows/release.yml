name: Release

# Build, sign and publish when a version tag is pushed (e.g. v4.0.0), or run
# it by hand from main with the version as input: then the GitHub release
# step creates the tag on the commit that was built.
# PyPI uses Trusted Publishing (OIDC): no API token is stored in the repo.
# One-time setup: add this repo + workflow as a trusted publisher at
# https://pypi.org/manage/project/llm-sanitizer-pro/settings/publishing/
# and create a "pypi" environment in the repository settings.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release from main (e.g. 4.0.0); must match __version__'
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # Sigstore signing and build provenance
      attestations: write   # GitHub artifact attestations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Tag matches the built version
        run: |
          version=$(basename dist/*.whl | cut -d- -f2)
          test "v$version" = "$TAG" || { echo "tag $TAG != v$version"; exit 1; }
      - name: SBOM (CycloneDX) of the wheel with all extras
        run: |
          python -m venv /tmp/sbom-env
          /tmp/sbom-env/bin/pip install --quiet "$(ls dist/*.whl)[all]"
          pip install cyclonedx-bom
          cyclonedx-py environment /tmp/sbom-env/bin/python --output-format JSON \
            --output-file sbom.cdx.json
      - name: Release notes from CHANGELOG.md
        run: python scripts/release_notes.py "$TAG" > release-notes.md
      - name: Build provenance (SLSA, GitHub attestations)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'
      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          upload-signing-artifacts: false
          release-signing-artifacts: false
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheel
          path: dist/*.whl
          if-no-files-found: error
      - name: Stage release assets
        run: |
          mkdir release-assets
          cp dist/*.sigstore.json sbom.cdx.json release-notes.md release-assets/
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # Trusted Publishing; also uploads PEP 740 attestations
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist*
          path: dist/
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Independent of the PyPI upload: the signed release and its tag do not
  # wait for (or get lost with) a PyPI configuration problem. Re-running the
  # workflow after a failed upload reuses the existing release.
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets/
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping it."
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file assets/release-notes.md \
            assets/*.tar.gz assets/*.whl assets/*.sigstore.json assets/sbom.cdx.json

  # Container image ghcr.io/<owner>/llm-sanitizer-pro:{version,latest}. Each
  # architecture is built natively and pushed by digest; publish-image joins them
  # into one multi-arch image, signs it (keyless) and attaches build provenance.
  image:
    needs: build
    name: image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, arch: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/llm-sanitizer-pro" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Provenance is attached to the multi-arch image in publish-image.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Record digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error

  publish-image:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write       # Sigstore keyless signing
      attestations: write
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/llm-sanitizer-pro" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Create the multi-arch image
        id: index
        run: |
          version="${TAG#v}"
          docker buildx imagetools create -t "${IMAGE}:${version}" -t "${IMAGE}:latest" \
            "${IMAGE}@$(cat digests/amd64)" "${IMAGE}@$(cat digests/arm64)"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Sign the image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.index.outputs.digest }}"
      - name: Build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
