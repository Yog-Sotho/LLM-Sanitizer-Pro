name: Release

# Build, sign and publish when a version tag is pushed (e.g. v4.0.0).
# PyPI uses Trusted Publishing (OIDC): no API token is stored in the repo.
# One-time setup: add this repo + workflow as a trusted publisher at
# https://pypi.org/manage/project/llm-sanitizer-pro/settings/publishing/
# and create a "pypi" environment in the repository settings.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # Sigstore signing and build provenance
      attestations: write   # GitHub artifact attestations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Tag matches the built version
        run: |
          version=$(basename dist/*.whl | cut -d- -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: SBOM (CycloneDX) of the wheel with all extras
        run: |
          python -m venv /tmp/sbom-env
          /tmp/sbom-env/bin/pip install --quiet "$(ls dist/*.whl)[all]"
          pip install cyclonedx-bom
          cyclonedx-py environment /tmp/sbom-env/bin/python --output-format JSON \
            --output-file sbom.cdx.json
      - name: Release notes from CHANGELOG.md
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
      - name: Build provenance (SLSA, GitHub attestations)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          upload-signing-artifacts: false
          release-signing-artifacts: false
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheel
          path: dist/*.whl
          if-no-files-found: error
      - name: Stage release assets
        run: |
          mkdir release-assets
          cp dist/*.sigstore.json sbom.cdx.json release-notes.md release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # Trusted Publishing; also uploads PEP 740 attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist*
          path: dist/
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets/
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file assets/release-notes.md \
            assets/*.tar.gz assets/*.whl assets/*.sigstore.json assets/sbom.cdx.json
